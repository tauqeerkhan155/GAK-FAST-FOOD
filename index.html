<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAK Fast Food - POS & Admin</title>
<style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f9; color: #333; }
    .hidden { display: none !important; }
    
    /* Login Screen */
    #loginScreen {
        display: flex; justify-content: center; align-items: center; height: 100vh; background: #2c3e50;
    }
    .login-box {
        background: white; padding: 30px; border-radius: 10px; width: 300px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-align: center;
    }
    .login-box h2 { margin-bottom: 20px; color: #2c3e50; }
    .login-box input {
        width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;
    }
    .login-box button {
        width: 100%; padding: 10px; background: #27ae60; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;
    }

    /* Dashboard Layout */
    #dashboard { display: flex; flex-direction: column; height: 100vh; }
    header { background: #2c3e50; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
    nav button { background: #34495e; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-left: 5px; }
    nav button.active { background: #e74c3c; }

    .content-area { display: flex; flex: 1; overflow: hidden; }
    
    /* POS Section */
    .pos-main { flex: 2; padding: 15px; overflow-y: auto; }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 15px; }
    .menu-card { background: white; padding: 15px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; border: 1px solid #ddd; }
    .menu-card h4 { margin: 5px 0; font-size: 14px; }
    .menu-card p { margin: 0; color: #27ae60; font-weight: bold; }

    /* Cart Section */
    .pos-cart { flex: 1; background: white; padding: 15px; box-shadow: -2px 0 5px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
    .cart-items { flex: 1; overflow-y: auto; border-bottom: 1px solid #ddd; margin-bottom: 10px; }
    .cart-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
    .total-box { font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; margin-bottom: 15px; color: #e74c3c; }
    .checkout-btn { background: #27ae60; color: white; border: none; padding: 12px; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }

    /* Reports Section */
    .reports-container { padding: 20px; overflow-y: auto; flex: 1; }
    .report-card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
</style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen">
    <div class="login-box">
        <h2>GAK Fast Food</h2>
        <input type="text" id="username" placeholder="Username (admin)">
        <input type="password" id="password" placeholder="Password (123)">
        <button onclick="handleLogin()">Login</button>
    </div>
</div>

<!-- Main Dashboard -->
<div id="dashboard" class="hidden">
    <header>
        <h2>GAK Admin & POS</h2>
        <nav>
            <button id="navPos" class="active" onclick="switchTab('pos')">POS / Order</button>
            <button id="navReport" onclick="switchTab('reports')">Sales Report</button>
            <button onclick="handleLogout()" style="background: #c0392b;">Logout</button>
        </nav>
    </header>

    <div class="content-area" id="posTab">
        <div class="pos-main">
            <h3>Menu Items</h3>
            <input type="text" id="searchBox" placeholder="Search items..." onkeyup="filterMenu()" style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box;">
            <div class="menu-grid" id="menuGrid"></div>
        </div>
        
        <div class="pos-cart">
            <h3>Current Bill</h3>
            <div class="cart-items" id="cartItems">
                <p style="color: #888; text-align: center;">Cart is empty</p>
            </div>
            <div class="total-box">
                <span>Total:</span>
                <span id="grandTotal">Rs 0</span>
            </div>
            <button class="checkout-btn" onclick="completeOrder()">Complete Order</button>
        </div>
    </div>

    <div class="reports-container hidden" id="reportsTab">
        <h2>Sales Reports</h2>
        <div class="report-card">
            <h3>Today's Total Sale</h3>
            <p id="todaySale" style="font-size: 24px; color: #27ae60; font-weight: bold;">Rs 0</p>
        </div>
        <div class="report-card">
            <h3>Monthly Total Sale</h3>
            <p id="monthlySale" style="font-size: 24px; color: #2980b9; font-weight: bold;">Rs 0</p>
        </div>
    </div>
</div>

<script>
    const menuItems = [
        { name: "Zinger Burger", price: 300 },
        { name: "Smokey Burger", price: 500 },
        { name: "Plain Fries (Small)", price: 150 },
        { name: "Plain Fries (Large)", price: 350 },
        { name: "Chicken Tikka Pizza (S)", price: 500 },
        { name: "Chicken Tikka Pizza (M)", price: 1000 },
        { name: "Shawarma", price: 150 },
        { name: "Zinger Shawarma", price: 300 },
        { name: "Alfredo Pasta", price: 500 },
        { name: "Pepsi (500ml)", price: 120 }
    ];

    let cart = [];
    let salesHistory = JSON.parse(localStorage.getItem('gak_sales')) || [];

    function handleLogin() {
        let user = document.getElementById('username').value;
        let pass = document.getElementById('password').value;
        
        if (user === "admin" && pass === "123") {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            loadMenu(menuItems);
            updateReports();
        } else {
            alert("Galat Username ya Password hai! (Username: admin, Password: 123)");
        }
    }

    function handleLogout() {
        document.getElementById('dashboard').classList.add('hidden');
        document.getElementById('loginScreen').classList.remove('hidden');
    }

    function switchTab(tab) {
        if(tab === 'pos') {
            document.getElementById('posTab').classList.remove('hidden');
            document.getElementById('reportsTab').classList.add('hidden');
            document.getElementById('navPos').classList.add('active');
            document.getElementById('navReport').classList.remove('active');
        } else {
            document.getElementById('posTab').classList.add('hidden');
            document.getElementById('reportsTab').classList.remove('hidden');
            document.getElementById('navReport').classList.add('active');
            document.getElementById('navPos').classList.remove('active');
            updateReports();
        }
    }

    function loadMenu(items) {
        const grid = document.getElementById('menuGrid');
        grid.innerHTML = "";
        items.forEach(item => {
            grid.innerHTML += `
                <div class="menu-card" onclick="addToCart('${item.name}', ${item.price})">
                    <h4>${item.name}</h4>
                    <p>Rs ${item.price}</p>
                </div>
            `;
        });
    }

    function addToCart(name, price) {
        let found = cart.find(i => i.name === name);
        if(found) {
            found.qty += 1;
        } else {
            cart.push({ name, price, qty: 1 });
        }
        renderCart();
    }

    function renderCart() {
        const container = document.getElementById('cartItems');
        const totalEl = document.getElementById('grandTotal');
        
        if(cart.length === 0) {
            container.innerHTML = '<p style="color: #888; text-align: center;">Cart is empty</p>';
            totalEl.innerText = "Rs 0";
            return;
        }

        container.innerHTML = "";
        let total = 0;
        cart.forEach((item, index) => {
            let subtotal = item.price * item.qty;
            total += subtotal;
            container.innerHTML += `
                <div class="cart-row">
                    <span>${item.qty}x ${item.name}</span>
                    <span>Rs ${subtotal} <button onclick="removeItem(${index})" style="background:red; color:white; border:none; border-radius:3px; padding:2px 5px;">X</button></span>
                </div>
            `;
        });
        totalEl.innerText = "Rs " + total;
    }

    function removeItem(index) {
        cart.splice(index, 1);
        renderCart();
    }

    function completeOrder() {
        if(cart.length === 0) {
            alert("Cart khaali hai!");
            return;
        }
        let total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        
        // Save sale with current date
        salesHistory.push({
            date: new Date().toISOString(),
            total: total
        });
        localStorage.setItem('gak_sales', JSON.stringify(salesHistory));

        alert("Order Complete! Sale recorded.");
        cart = [];
        renderCart();
        updateReports();
    }

    function updateReports() {
        let todayStr = new Date().toISOString().split('T')[0];
        let currentMonthStr = todayStr.substring(0, 7); // YYYY-MM

        let todayTotal = 0;
        let monthlyTotal = 0;

        salesHistory.forEach(sale => {
            let saleDate = sale.date.split('T')[0];
            if(saleDate === todayStr) {
                todayTotal += sale.total;
            }
            if(saleDate.startsWith(currentMonthStr)) {
                monthlyTotal += sale.total;
            }
        });

        document.getElementById('todaySale').innerText = "Rs " + todayTotal;
        document.getElementById('monthlySale').innerText = "Rs " + monthlyTotal;
    }

    function filterMenu() {
        let query = document.getElementById('searchBox').value.toLowerCase();
        let filtered = menuItems.filter(i => i.name.toLowerCase().includes(query));
        loadMenu(filtered);
    }
</script>

</body>
</html>
